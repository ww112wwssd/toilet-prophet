<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>厕所先知｜手机端预览</title>
<style>
:root{--ink:#17151e;--paper:#f8f7f2;--lime:#d8ff19;--purple:#6548e8;--pink:#ff5d86}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei",Arial,sans-serif}main{max-width:480px;min-height:100vh;margin:auto;padding-bottom:92px;background:var(--paper)}header{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 16px;border-bottom:3px solid var(--ink);background:#fff}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border:3px solid var(--ink);border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:22px}.brand b{font-size:24px;letter-spacing:2px}.brand small{display:block;letter-spacing:2px;font-size:9px}.status{background:var(--lime);border:3px solid var(--ink);border-radius:24px;padding:10px 13px;font-weight:700;font-size:12px}.ticker{background:var(--lime);border-bottom:3px solid var(--ink);padding:11px 20px;font-size:13px;font-weight:700}.wrap{padding:24px 18px}.eyebrow{color:var(--purple);font-weight:800;letter-spacing:3px;font-size:12px}.title{font-size:34px;line-height:1.15;margin:9px 0 8px;font-weight:900}.desc{color:#6f6b76;font-size:14px;margin-bottom:20px}.card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:18px;box-shadow:7px 8px 0 var(--ink);margin-bottom:20px}.clue{background:#f1efff;border-radius:14px;padding:14px;color:#51439e;font-size:14px}.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.door{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:12px 6px;text-align:center;cursor:pointer;transition:.15s}.door:hover,.door.selected{background:var(--lime);transform:translateY(-3px)}.door .num{font-size:11px;color:#777}.door strong{display:block;font-size:28px;margin:8px 0}.door span{font-size:13px}.deadline{display:flex;justify-content:space-between;margin-top:18px;color:#777;font-size:12px}.confirm{width:100%;margin-top:18px;border:3px solid var(--ink);border-radius:14px;padding:13px;background:var(--purple);color:white;font-size:16px;font-weight:800;cursor:pointer}.confirm:disabled{background:#d8d5ce;color:#777;cursor:default}.notice{text-align:center;color:#6f6b76;font-size:13px;margin-top:12px;min-height:18px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:3px solid var(--ink);padding:10px 8px 13px}.nav a{text-align:center;color:#6f6b76;text-decoration:none;font-size:12px}.nav a.active{color:var(--ink);font-weight:800}.nav i{display:block;font-style:normal;font-size:21px;margin-bottom:3px}@media(min-width:481px){body{padding:20px 0}}
</style></head>
<body><main><header><div class="brand"><div class="logo">◉</div><div><b>厕所先知</b><small>TOILET PROPHET</small></div></div><div class="status">本期进行中</div></header><div class="ticker">⌁ 第 018 期　·　今晚 20:30 封盘　·　猜中就有一次开盒机会 ⌁</div><section class="wrap"><div class="eyebrow">TODAY'S GUESS</div><h1 class="title">先知今天进了哪扇门？</h1><p class="desc">三扇门里只有一扇是真的。选定后不能反悔，今晚揭晓。</p><div class="card"><div class="clue">线索：他带着手机，走得很急，出来时心情很好。</div><div class="doors"><button class="door" data-door="1"><span class="num">01</span><strong>1</strong><span>1号门</span></button><button class="door" data-door="2"><span class="num">02</span><strong>2</strong><span>2号门</span></button><button class="door" data-door="3"><span class="num">03</span><strong>3</strong><span>3号门</span></button></div><div class="deadline"><span>投票截止</span><b>今天 20:30</b></div><button class="confirm" disabled>先选一扇门</button><div class="notice" aria-live="polite"></div></div></section></main><nav class="nav"><a class="active" href="#"><i>◉</i>今日</a><a href="#"><i>♛</i>排行</a><a href="#"><i>▤</i>记录</a><a href="#"><i>✦</i>奖品</a></nav><script>const doors=document.querySelectorAll('.door'),btn=document.querySelector('.confirm'),notice=document.querySelector('.notice');let selected='';doors.forEach(d=>d.addEventListener('click',()=>{doors.forEach(x=>x.classList.remove('selected'));d.classList.add('selected');selected=d.dataset.door;btn.disabled=false;btn.textContent='确认选择 '+selected+' 号门'}));btn.addEventListener('click',()=>{if(!selected)return;doors.forEach(d=>d.disabled=true);btn.disabled=true;btn.textContent='已封盘 · 等待揭晓';notice.textContent='你的选择已记录，等待今晚揭晓'});</script></body></html>
